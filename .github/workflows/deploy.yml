name: Taskly CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

env:
  REGISTRY: acrkingslystaging.azurecr.io
  IMAGE_NAME: taskly-api
  STAGING_RESOURCE_GROUP: rg-kingsly-staging
  STAGING_CLUSTER_NAME: aks-kingsly-staging
  STAGING_NAMESPACE: taskly
  PRODUCTION_RESOURCE_GROUP: rg-kingsly-production
  PRODUCTION_CLUSTER_NAME: aks-kingsly-production
  PRODUCTION_NAMESPACE: production

jobs:
  build-and-test:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"
          pip install pytest flake8 || echo "Test dependencies installed"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting issues found"
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          pytest tests/ || echo "No tests found, skipping"

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Set AKS context for staging
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.STAGING_RESOURCE_GROUP }}
          cluster-name: ${{ env.STAGING_CLUSTER_NAME }}
          admin: true

      - name: Create namespace if it doesn't exist
        run: |
          kubectl create namespace ${{ env.STAGING_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ACR secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --namespace ${{ env.STAGING_NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --docker-email=kingsly@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging
        run: |
          kubectl set image deployment/taskly-api \
            taskly-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.STAGING_NAMESPACE }} 2>/dev/null || kubectl apply -f k8s-deployment.yaml -n ${{ env.STAGING_NAMESPACE }}
          
          kubectl rollout status deployment/taskly-api -n ${{ env.STAGING_NAMESPACE }} --timeout=5m

      - name: Verify staging deployment
        run: |
          kubectl get pods -n ${{ env.STAGING_NAMESPACE }}
          kubectl get services -n ${{ env.STAGING_NAMESPACE }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Set AKS context for production
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.PRODUCTION_RESOURCE_GROUP }}
          cluster-name: ${{ env.PRODUCTION_CLUSTER_NAME }}
          admin: true

      - name: Create namespace if it doesn't exist
        run: |
          kubectl create namespace ${{ env.PRODUCTION_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ACR secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --namespace ${{ env.PRODUCTION_NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --docker-email=kingsly@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create taskly secrets
        run: |
          kubectl create secret generic taskly-secrets \
            --namespace ${{ env.PRODUCTION_NAMESPACE }} \
            --from-literal=DATABASE_URL='postgresql://kingslyadmin:KingslySecurePass123!@postgres-kingsly-production.postgres.database.azure.com:5432/taskly' \
            --from-literal=REDIS_URL='redis://redis-kingsly-production.centralus.redis.azure.net:6379' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to production
        run: |
          kubectl set image deployment/taskly-api \
            taskly-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.PRODUCTION_NAMESPACE }} 2>/dev/null || kubectl apply -f k8s-deployment.yaml -n ${{ env.PRODUCTION_NAMESPACE }}
          
          kubectl rollout status deployment/taskly-api -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=5m

      - name: Verify production deployment
        run: |
          kubectl get pods -n ${{ env.PRODUCTION_NAMESPACE }}
          kubectl get services -n ${{ env.PRODUCTION_NAMESPACE }}

      - name: Get production external IP
        run: |
          PROD_IP=$(kubectl get service taskly-api -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "✅ Production is live at: http://$PROD_IP"

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.PRODUCTION_RESOURCE_GROUP }}
          cluster-name: ${{ env.PRODUCTION_CLUSTER_NAME }}
          admin: true

      - name: Rollback production deployment
        run: |
          kubectl rollout undo deployment/taskly-api -n ${{ env.PRODUCTION_NAMESPACE }}
          kubectl rollout status deployment/taskly-api -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=5m
          echo "✅ Rollback completed successfully!"
