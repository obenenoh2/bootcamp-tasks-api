apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskly-api
  namespace: taskly
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskly-api
  template:
    metadata:
      labels:
        app: taskly-api
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: taskly-api
          image: acrkingslyproduction.azurecr.io/taskly-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-secrets
                  key: REDIS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: taskly-api
  namespace: taskly
spec:
  selector:
    app: taskly-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
